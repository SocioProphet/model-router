name: environment-state-routing

on:
  pull_request:
    branches: [ main ]
    paths:
      - "examples/environment-state-routing-policy.*.json"
      - "tools/validate_environment_state_routing.py"
      - ".github/workflows/environment-state-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-environment-state-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate environment state routing fixtures
        run: python3 tools/validate_environment_state_routing.py
