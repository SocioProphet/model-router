name: SVF Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  svf-receipt-state-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate SVF receipt-state routing
        run: make validate-svf-receipt-state-routing
