name: professional-intelligence-routing

on:
  pull_request:
    paths:
      - "schemas/professional-intelligence-routing-decision.schema.json"
      - "examples/professional-intelligence/routing-decision.*.example.json"
      - "scripts/validate_professional_intelligence_routing.py"
      - ".github/workflows/professional-intelligence-routing.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/professional-intelligence-routing-decision.schema.json"
      - "examples/professional-intelligence/routing-decision.*.example.json"
      - "scripts/validate_professional_intelligence_routing.py"
      - ".github/workflows/professional-intelligence-routing.yml"

jobs:
  validate-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install jsonschema
      - name: Validate Professional Intelligence routing decisions
        run: python scripts/validate_professional_intelligence_routing.py
